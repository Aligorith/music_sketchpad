
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Sketchpad</title>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>

<link rel="stylesheet" type="text/css" href="assets/style.css">
</head>

<body>

<header>
  <h1>Music Sketchpad</h1>

  <div class="header-controls">

    <div class="field">
      <label>BPM</label>
      <input id="tempo" type="number"
             min="20" max="300" value="100">
    </div>

    <div class="field">
      <label>Start beat</label>
      <input id="marker" type="number"
             min="0" step=".25" value="0">
    </div>

    <button id="play">▶</button>
    <button id="stop" class="secondary" disabled>■</button>

  </div>
</header>

<main>
<main>

  <!-- LARGE SCORE -->

  <section class="panel" id="scorePanel">

    <div id="scoreScroll">
      <div id="score"></div>
    </div>

    <div id="progress">
      <div id="progressBar"></div>
    </div>

    <div class="status" id="status">Ready.</div>

  </section>


  <!-- COMPACT EDITOR -->

  <section class="panel" id="editorPanel">

    <!-- PART SELECTOR -->

    <div class="editor-top">

      <div id="parts"></div>

      <button id="addPart" class="secondary">+</button>

      <input id="partName" type="text"
             placeholder="Part name">

      <select id="instrument">
        <option value="acoustic_grand_piano">Piano</option>
        <option value="oboe">Oboe</option>
        <option value="flute">Flute</option>
        <option value="clarinet">Clarinet</option>
        <option value="marimba">Marimba</option>
        <option value="orchestral_harp">Harp</option>
        <option value="french_horn">Horn</option>
      </select>

      <input id="volume" type="range"
             min="0" max="1" step=".05" value=".8">

      <button id="refresh" class="secondary">↻</button>
      <button id="clear" class="secondary">Clear</button>

    </div>


    <!-- LILYPOND TEXT -->

    <textarea id="notation"
      spellcheck="false"
      placeholder="LilyPond notation..."></textarea>


    <!-- NOTE ENTRY CONTROLS -->

    <div class="entry-controls">

      <!-- NOTE NAMES -->

      <div class="button-group">

        <button class="note-button" data-note="c">C</button>
        <button class="note-button" data-note="d">D</button>
        <button class="note-button" data-note="e">E</button>
        <button class="note-button" data-note="f">F</button>
        <button class="note-button" data-note="g">G</button>
        <button class="note-button" data-note="a">A</button>
        <button class="note-button" data-note="b">B</button>

      </div>


      <!-- REST -->

      <button class="note-button control-button"
              id="restButton">R</button>


      <!-- ACCIDENTALS -->

      <div class="button-stack">

        <button class="control-button"
                id="semitoneUp">♯ +</button>

        <button class="control-button"
                id="semitoneDown">♭ −</button>

      </div>


      <!-- OCTAVE -->

      <div class="button-stack">

        <button class="control-button"
                id="octaveUp">Oct +</button>

        <button class="control-button"
                id="octaveDown">Oct −</button>

      </div>


      <!-- DURATION -->

      <div class="button-stack">

        <button class="control-button"
                id="doubleDuration">×2</button>

        <button class="control-button"
                id="halfDuration">÷2</button>

      </div>

      <div class="button-stack">

        <button class="control-button"
                id="dotUp">+1.5</button>

        <button class="control-button"
                id="dotDown">−1.5</button>

      </div>


      <!-- BARLINE -->

      <button class="note-button control-button"
              id="barButton">|</button>

    </div>

    <div id="durationDisplay">
      Current duration: crotchet (4)
    </div>

  </section>
</main>

<script type="text/javascript" src="assets/music_sketchpad.js"></script>
</body>
</html>
